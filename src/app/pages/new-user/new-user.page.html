<ion-content [fullscreen]="true" class="newuser-content" style="color: primario1;">

  <div class="mobile-wrapper">

  <!-- Cabecera -->

  <ion-header translucent="true" class="header-bar">
  <ion-toolbar color="none" class="bar-inside">
    <ion-title style="text-align: center;">
      <ion-button class="goback" fill="clear" routerLink="/mainpage"
      ><ion-icon name="arrow-back-outline" style="height: 32px; width: 32px; color: #E57722;"></ion-icon></ion-button>
      <strong style="color: #E57722; font-size: 22px;">Nuevo Usuario</strong>
    </ion-title>

  </ion-toolbar>
  </ion-header>
  

  <!-- Los Inputs con un form agrupandolos -->

  <form [formGroup]="form">

  

  <!-- Input de email -->

  <app-custom-input 
  autocomplete="email"
  icon="mail-outline"
  [control]="form.controls.email"
  type="email"
  label="Correo Electronico"
  
  ></app-custom-input>   


  <!-- Input de password -->


  <app-custom-input 
  [control]="form.controls.password"
  icon="lock-closed-outline"
  type="password"
  label="Contraseña"
  
  ></app-custom-input>
  
  
  <!-- Input de empresa -->


  <app-custom-input 
  [control]="form.controls.empresa"
  icon="briefcase-outline"
  type="text"
  label="Empresa u Organización"
  
  ></app-custom-input>
  
  
  <!-- Selector de paises -->
  <app-custom-input
    [control]="form.controls.country"
    icon="earth-outline"
    type="select"
    [options]="countries">
  </app-custom-input>



  <!-- Terminos y condiciones -->
  <div class="terms-container">

  <ion-checkbox
   class="checkbox" formControlName="acceptTerms" >
  </ion-checkbox>

  <span class="terms-text">
    Estoy de acuerdo con las
    <a href="#">Condiciones de Uso</a>
    de este sitio y he leído y acepto la
    <a href="#">Política de Privacidad</a>.
  </span>

  </div>



  <!-- Muestra los datos de los inputs en pantalla 
  {{form.value | json}}    -->



  <div class="login-button">

      <ion-button fill="solid" class="sing-up" color="primario-main" shape="round"
      (click)="registrar()" [disabled]="form.invalid">
        Registrarse
      </ion-button>
  
  </div>




  </form>


  </div>




</ion-content>
