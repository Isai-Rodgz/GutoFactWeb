<ion-content [fullscreen]="true" class="work-desk-content">

  <!-- HEADER -->
  <div class="top-header">

    <ion-button
      fill="clear"
      class="header-button">
      <ion-icon name="menu-outline"></ion-icon>
    </ion-button>

    <div class="header-title">
      <span>Ticket</span>

      <span class="ticket-number">0</span>
    </div>

    <div class="header-actions">

      <ion-button
        fill="clear"
        class="header-button">
        <ion-icon src="assets/icon/user-add.svg"></ion-icon>
      </ion-button>

      <ion-button
        fill="clear"
        class="header-button">
        <ion-icon name="ellipsis-vertical"></ion-icon>
      </ion-button>

    </div>

  </div>



  <!-- DATOS DEL USUARIO -->
  <div class="user-info">

    <div class="user-welcome">

      <h2>
        Bienvenido,
        {{ session.user()?.empresa }}
      </h2>

      <p>
        {{ session.user()?.email }}
      </p>

      <p>
        Desde {{ session.user()?.country }}
      </p>

    </div>

    <ion-button
      fill="clear"
      class="logout-button"
      (click)="logout()">

      Cerrar Sesión

    </ion-button>

  </div>
 




    <!-- RESUMEN -->
  <div class="summary">

    <div class="summary-item">

      <span class="summary-label">
        Tickets Abiertos
      </span>

      <strong class="summary-value">
        0
      </strong>

    </div>

    <div class="summary-item">

      <span class="summary-label">
        Cobrar
      </span>

      <strong class="summary-value">
        RD$0.00
      </strong>

    </div>

  </div>


  <!-- FILTRO Y BUSQUEDA -->
  <div class="search-container">

    <div class="category-select">

      <span>Todos los artículos</span>

      <ion-icon
        name="chevron-down-outline">
      </ion-icon>

    </div>

    <div class="search-button">

      <ion-icon
        name="search-outline">
      </ion-icon>

    </div>

  </div>


  <!-- CONTENIDO -->
  <div class="empty-state">

    <ion-icon
      class="cash-register-icon"
      src="assets/icon/cash-register.svg">
    </ion-icon>

    <h2>
      El turno está cerrado
    </h2>

    <p>
      Abre el turno para realizar ventas
    </p>

    <ion-button
      class="open-shift-button">
      Abrir el turno
    </ion-button>

  </div>

</ion-content>
