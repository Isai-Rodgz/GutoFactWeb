<ion-content [fullscreen]="true" class="login-content" style="color: primario1;">

  <div class="mobile-wrapper">

  <!-- Cabecera -->

  <ion-header translucent="true" class="header-bar">
  <ion-toolbar color="none" class="bar-inside">
    <ion-title style="text-align: center;">
      <ion-button class="goback" fill="clear" routerLink="/log-in"
      ><ion-icon name="arrow-back-outline" style="height: 32px; width: 32px; color: #E57722;"></ion-icon></ion-button>
      <strong style="color: #E57722; font-size: 20px;">¿Has olvidado tu contraseña?</strong>
    </ion-title>

  </ion-toolbar>
  </ion-header>
  

  <!-- Los Inputs con un form agrupandolos -->

  <form [formGroup]="form">



  <!-- Parrafo-->
  <div class="parrafo-container">

  <span class="parrafo-text">
    <strong><p> Introduzca su correo electronico para recibir instrucciones para 
    restablecer la contraseña. </p></strong>
  </span>

  </div>
  

  <!-- Input de email -->

  <app-custom-input 
  autocomplete="email"
  icon="mail-outline"
  [control]="form.controls.email"
  type="email"
  label="Correo Electronico"
  
  ></app-custom-input>   

  <!-- Muestra los datos de los inputs en pantalla 
  {{form.value | json}}    -->



  <div class="reset-pass-button">

      <ion-button fill="solid" class="reset-pass" color="primario-main" shape="round"
      routerLink="/" [disabled]="form.invalid">
        Enviar
      </ion-button>
  
  </div>




  </form>


  </div>




</ion-content>
